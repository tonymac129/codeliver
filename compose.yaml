services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: express-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: "./backend/.env"
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nextjs-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: "./frontend/.env"
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
